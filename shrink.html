<!doctype html><meta charset=utf-8><title>NanoSynth-2K</title><style>body{margin:0;background:#080c18;color:#cfe6ff;font:12px monospace}canvas{width:100%;image-rendering:pixelated;cursor:crosshair}button,input,select{font:inherit;background:#14213a;color:#cfe6ff;border:1px solid #3a5b8c;cursor:pointer}#a{background:#8c2b3a}#a.on{background:#1f7a4a}#bar{padding:5px;display:flex;flex-wrap:wrap;gap:5px;align-items:center}input[type=range]{width:64px}h1{font-size:13px;margin:0 5px;display:inline}small{opacity:.6}</style><h1>NanoSynth-2K</h1><div id=bar><button id=a>Audio: OFF</button><button id=p>Play</button><select id=m><option value=ks>Karplus-Strong</option><option value=fm>FM</option></select><label>WL<input id=w type=range min=6 max=80 value=26></label><label>Hz<input id=f type=range min=80 max=880 value=220></label><label>Damp<input id=d type=range min=900 max=1000 value=996></label><label>Ratio<input id=r type=range min=1 max=8 step=.5 value=2></label><button id=rs>Reset</button><small>drag to move source 2</small></div><canvas id=c width=320 height=180></canvas><script>
var C=c.getContext('2d'),I=C.createImageData(320,180),D=I.data,A=0,AC,S=[{x:.28,y:.5,a:1,p:0},{x:.72,y:.5,a:1,p:0}],q=s=>document.querySelector(s),v=i=>+q(i).value;
function draw(){var k=6.283/v('#w'),i=0;for(var y=0;y<180;y++)for(var x=0;x<320;x++){var re=0,im=0;for(var s=0;s<2;s++){var z=S[s],d=Math.hypot(x-z.x*320,y-z.y*180),a=1/Math.sqrt(1+.004*d),p=k*d;re+=a*Math.cos(p);im+=a*Math.sin(p)}var u=Math.min(1,(re*re+im*im)/4);D[i++]=u*u*255;D[i++]=u*190;D[i++]=60+u*195;D[i++]=255}C.putImageData(I,0,0);C.fillStyle='#fff';for(var s=0;s<2;s++){C.beginPath();C.arc(S[s].x*320,S[s].y*180,3,0,7);C.fill()}}
function tone(){if(!A)return;var f=v('#f'),sr=AC.sampleRate,n=sr|0,b=AC.createBuffer(1,n,sr),o=b.getChannelData(0),ks=q('#m').value=='ks',j;if(ks){var N=Math.round(sr/f),dp=v('#d')/1000,L=new Float32Array(N),sd=12345,ix=0;for(j=0;j<N;j++){sd=(sd*1664525+1013904223)>>>0;L[j]=2*(sd/4294967296)-1}for(j=0;j<n;j++){var cu=L[ix],e=L[(ix+1)%N];o[j]=cu*.7;L[ix]=.5*(cu+e)*dp;ix=(ix+1)%N}}else{var ra=v('#r'),mi=3;for(j=0;j<n;j++){var t=j/sr,en=Math.min(1,j/(sr*.005))*Math.exp(-3*j/n);o[j]=en*.6*Math.sin(6.283*f*t+mi*Math.sin(6.283*f*ra*t))}}var g=AC.createGain(),src=AC.createBufferSource();src.buffer=b;g.gain.value=.8;src.connect(g);g.connect(AC.destination);src.start()}
a.onclick=function(){A=!A;this.textContent='Audio: '+(A?'ON':'OFF');this.className=A?'on':'';if(A){AC=AC||new AudioContext();AC.resume()}else AC.suspend()};
p.onclick=tone;rs.onclick=function(){S=[{x:.28,y:.5,a:1,p:0},{x:.72,y:.5,a:1,p:0}];w.value=26;f.value=220;d.value=996;r.value=2;draw()};oninput=draw;
c.onpointerdown=c.onpointermove=function(e){if(e.buttons&1||e.type=='pointerdown'){var b=c.getBoundingClientRect();S[1].x=Math.max(0,Math.min(1,(e.clientX-b.left)/b.width));S[1].y=Math.max(0,Math.min(1,(e.clientY-b.top)/b.height));draw()}};draw();
