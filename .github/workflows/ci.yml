name: Tests and byte budget

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run unit tests
        run: node --test test/nanosynth.test.js
      - name: Verify data URI is reproducible
        run: node tools/generate_data_uri.js && git diff --exit-code DATA_URI.txt
